<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="color-scheme" content="dark">
  <title>BOP MASTER Lift</title>
  <style>
    *{box-sizing:border-box}html{background:#0b0d0f}body{margin:0;min-width:240px;min-height:100dvh;background:#0b0d0f;color:#f7f7f5;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}.wrap{width:min(100%,430px);min-height:100dvh;margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:8px 2px 14px;font-weight:950;letter-spacing:.13em}.mark{width:31px;height:31px;display:grid;place-items:center;background:#f5c400;color:#090a0b;border-radius:5px;font-size:15px;letter-spacing:-.08em}.panel{position:relative;overflow:hidden;background:#15191d;border:1px solid #353a40;border-radius:17px;padding:18px;box-shadow:0 18px 45px #0008}.panel:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:repeating-linear-gradient(135deg,#f5c400 0 14px,#121416 14px 28px)}.presence{display:flex;align-items:center;gap:9px;min-height:48px;margin:3px 0 19px;padding:11px 13px;border:1px solid #2c5140;border-radius:11px;background:#14271f;color:#a7f3ca;font-weight:850;font-size:16px}.presence.off{border-color:#3a3d41;background:#202327;color:#d2d4d7}.presence.error{border-color:#693131;background:#2a1919;color:#ffb2b2}.dot{width:12px;height:12px;border-radius:50%;background:#2ddc7f;box-shadow:0 0 0 4px #2ddc7f20;flex:none}.off .dot{background:#686d73;box-shadow:none}.error .dot{background:#ef4444;box-shadow:none}.label{margin:0;color:#9da3aa;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.floor{margin:4px 0 17px;font-size:clamp(38px,13vw,62px);line-height:1;font-weight:950;letter-spacing:-.04em}.state{min-height:70px;display:flex;align-items:center;margin-bottom:13px;padding:13px 14px;border-left:5px solid #f5c400;background:#202429;color:#fff;font-size:18px;line-height:1.3;font-weight:850}.call,.cancel{width:100%;min-height:74px;border:0;border-radius:13px;padding:13px 10px;font:950 20px/1.1 Arial,sans-serif;cursor:pointer;touch-action:manipulation}.call{background:#f5c400;color:#0b0d0f;box-shadow:inset 0 -4px #a98700}.call:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -2px #a98700}.call:disabled{background:#5b5d5f;color:#bfc1c3;box-shadow:none;cursor:not-allowed}.cancel{min-height:58px;margin-top:10px;background:#3a1b1b;color:#ffd1d1;border:1px solid #7e3535;font-size:16px}.hidden{display:none}.network{margin-top:auto;padding:16px 4px 0;text-align:center;color:#7d8389;font-size:12px}.busy .call{pointer-events:none}@media(max-width:280px){.wrap{padding-left:8px;padding-right:8px}.panel{padding:14px}.brand{font-size:13px}.presence{font-size:14px}.floor{font-size:38px}.state{font-size:16px}.call{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand"><span class="mark">BM</span><span>BOP MASTER</span></header>
    <section class="panel" aria-live="polite">
      <div id="presence" class="presence off"><span class="dot"></span><span>Проверяем лифтёра…</span></div>
      <p class="label">Строительный лифт</p>
      <h1 id="floor" class="floor">Этаж —</h1>
      <div id="state" class="state">Подключение…</div>
      <button id="call" class="call" type="button" disabled>🛗 ВЫЗВАТЬ ЛИФТ</button>
      <button id="cancel" class="cancel hidden" type="button">ОТМЕНИТЬ МОЙ ВЫЗОВ</button>
    </section>
    <div id="network" class="network">BOP MASTER Lift</div>
  </main>
  <script>
  (()=>{'use strict';
    const $=id=>document.getElementById(id),u=new URL(location.href),floor=Number(u.searchParams.get('f')??u.searchParams.get('floor')),token=u.searchParams.get('t')||u.searchParams.get('k')||'';
    const presence=$('presence'),state=$('state'),call=$('call'),cancel=$('cancel'),network=$('network');
    const validFloor=Number.isInteger(floor)&&floor>=-1&&floor<=5;
    $('floor').textContent='Этаж '+(validFloor?floor:'—');
    const ownKey=validFloor?'bop_lift_call_'+floor:'';
    const apiUrl='https://drxhccirijpaohsgltlm.supabase.co/functions/v1/bop-master-lift/api';
    let busy=false,refreshing=false,timer=0,lastStatus='',autoAttempted=false;

    function setPresence(kind,text){presence.className='presence '+(kind||'');presence.lastElementChild.textContent=text}
    function own(){try{return JSON.parse(localStorage.getItem(ownKey)||'null')}catch{return null}}
    function save(v){try{v?localStorage.setItem(ownKey,JSON.stringify(v)):localStorage.removeItem(ownKey)}catch{}}
    function offline(){setPresence('error','Нет связи');state.textContent='Нет связи — вызов НЕ отправлен';call.disabled=true;network.textContent='Проверьте интернет и повторите';}
    async function api(action,data={}){
      const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
      try{
        const response=await fetch(apiUrl,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...data}),signal:controller.signal,cache:'no-store',credentials:'omit'});
        const json=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(json.error||'request_failed');
        return json.data;
      }finally{clearTimeout(timeout)}
    }
    function apply(data){
      const active=data&&data.call,available=!!data?.available,owned=own();
      setPresence(available?'':'off',available?'Лифтёр на месте':'Лифтёра нет на месте');
      network.textContent=navigator.onLine?'Связь есть':'Нет интернета';
      if(active){
        lastStatus=active.status;
        state.textContent=active.status==='going'?'Лифт едет':'Лифт вызван';
        call.disabled=true;
        const canCancel=active.status==='waiting'&&owned&&String(owned.id)===String(active.id)&&owned.cancelToken;
        cancel.classList.toggle('hidden',!canCancel);
        return;
      }
      if(owned)save(null);
      lastStatus='';cancel.classList.add('hidden');
      if(!available){state.textContent='Лифтёра сейчас нет. Можно идти пешком.';call.disabled=true;return}
      state.textContent='Лифт готов принять вызов';call.disabled=busy;
    }
    async function requestLift(){
      if(busy)return;busy=true;call.disabled=true;state.textContent='Отправляем вызов…';
      try{
        const result=await api('worker_request',{floor,floorToken:token});
        if(result?.created&&result.cancel_token)save({id:result.call.id,cancelToken:result.cancel_token});
        state.textContent=result?.call?.status==='going'?'Лифт едет':'Лифт вызван';
        await refresh(false);
      }catch(error){
        if(String(error.message).includes('operator_unavailable')){setPresence('off','Лифтёра нет на месте');state.textContent='Лифтёра сейчас нет. Можно идти пешком.'}
        else offline();
      }finally{busy=false}
    }
    async function refresh(allowAuto=true){
      if(!validFloor||!token){setPresence('error','QR-код недействителен');state.textContent='Отсканируйте QR-код возле лифта';call.disabled=true;return}
      if(refreshing)return;refreshing=true;
      try{
        const data=await api('worker_status',{floor,floorToken:token});apply(data);
        if(allowAuto&&!autoAttempted){
          autoAttempted=true;
          if(data.available&&!data.call)await requestLift();
        }
      }
      catch(error){if(String(error.message).includes('invalid_floor_token')){setPresence('error','QR-код недействителен');state.textContent='Этот QR-код больше не работает';call.disabled=true}else offline()}finally{refreshing=false}
    }
    call.addEventListener('click',requestLift);
    cancel.addEventListener('click',async()=>{
      const current=own();if(!current||busy)return;busy=true;cancel.disabled=true;state.textContent='Отменяем вызов…';
      try{
        const cancelled=await api('worker_cancel',{floor,floorToken:token,callId:current.id,cancelToken:current.cancelToken});
        if(cancelled)save(null);await refresh();
      }catch{state.textContent='Нет связи — отмена НЕ отправлена'}finally{busy=false;cancel.disabled=false}
    });
    addEventListener('online',refresh);addEventListener('offline',offline);
    refresh();timer=setInterval(()=>{if(!document.hidden)refresh()},3000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=20260903.4',{updateViaCache:'none'}).catch(()=>{});
  })();
  </script>
</body>
</html>
