<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOP MASTER • Lift</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section class="card"><div class="brand">BOP MASTER</div><div id="authBox"><div class="eyebrow">LIFT ACCESS</div><h1>Вход по ключу</h1><div class="authbox"><input id="operatorToken" autocomplete="off" placeholder="Ключ доступа"><button id="saveToken" class="btn">Войти</button></div></div><div id="panel" class="hidden"><div class="toprow"><div><div class="eyebrow">ПАНЕЛЬ ЛИФТЁРА</div><h1>Очередь вызовов</h1></div><button id="soundBtn" class="btn secondary compact">🔔 Звук: ВКЛ</button></div><div class="operator-tools"><button id="presenceBtn" class="btn success">🟢 НА МЕСТЕ</button><select id="floorSelect" class="field"><option value="-1">Сейчас: -1 этаж</option><option value="0">Сейчас: 0 этаж</option><option value="1">Сейчас: 1 этаж</option><option value="2">Сейчас: 2 этаж</option><option value="3">Сейчас: 3 этаж</option><option value="4">Сейчас: 4 этаж</option><option value="5">Сейчас: 5 этаж</option></select></div><div id="routeInfo" class="route-info">Расчёт маршрута: 5 сек/этаж</div><div id="current" class="current empty">Нет активных вызовов</div><div class="actions"><button id="goingBtn" class="btn warn" disabled>🚧 ЕДУ</button><button id="doneBtn" class="btn success" disabled>✅ ГОТОВО</button></div><h2>Умная очередь</h2><div id="queue" class="queue"></div></div></section><footer>Система: Hohus Maksym</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="operator.js"></script></body></html>
