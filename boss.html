<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOP MASTER • Lift</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section class="card"><div class="brand">BOP MASTER</div><div id="bossAuth"><div class="eyebrow">LIFT ACCESS</div><h1>Вход по ключу</h1><div class="authbox"><input id="bossToken" autocomplete="off" placeholder="Ключ доступа"><button id="bossLogin" class="btn">Войти</button></div></div><div id="bossPanel" class="hidden"><div class="eyebrow">КАБИНЕТ BOSS</div><h1 id="bossTitle">Управление лифтом</h1><div class="tabs boss-tabs"><button class="tab active" data-btab="lift">Лифт</button><button class="tab" data-btab="operator">Лифтёр</button></div><section id="btab-lift"><div id="bossLiftStatus" class="state waiting">Проверяем статус…</div><h2>Удалённый вызов</h2><p class="hint">Выберите этаж. У лифтёра этот вызов будет помечен BOSS.</p><div id="bossFloors" class="floor-buttons"></div><h2>Текущая очередь</h2><div id="bossQueue" class="queue"></div></section><section id="btab-operator" class="hidden"><h2>Смена лифтёра</h2><p class="hint">Новый ключ сразу отключает старый.</p><button id="bossRotateOperator" class="btn warn">🔑 Новый ключ лифтёра</button><div id="bossOperatorKey" class="keybox hidden"></div></section></div></section><footer>BOP MASTER • Hohus Maksym</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="boss.js"></script></body></html>
