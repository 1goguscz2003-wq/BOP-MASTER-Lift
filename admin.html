<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOP MASTER • Админ</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell wide"><section class="card"><div class="brand">BOP MASTER</div><div class="eyebrow">АДМИН-ПАНЕЛЬ</div><h1>Управление лифтом</h1><div id="adminAuth" class="authbox"><input id="adminToken" placeholder="Ключ администратора"><button id="adminLogin" class="btn">Войти</button></div><div id="adminPanel" class="hidden"><div class="tabs no-print"><button class="tab active" data-tab="stats">Статистика</button><button class="tab" data-tab="history">История</button><button class="tab" data-tab="qr">QR-коды</button></div><section id="tab-stats"><div class="stats"><div class="stat"><b id="sToday">0</b><span>сегодня</span></div><div class="stat"><b id="sDone">0</b><span>выполнено</span></div><div class="stat"><b id="sWaiting">0</b><span>активных</span></div><div class="stat"><b id="sTop">—</b><span>топ этаж</span></div></div><h2>По этажам</h2><div id="floorStats" class="queue"></div></section><section id="tab-history" class="hidden"><h2>Последние 100 вызовов</h2><div class="tablewrap"><table><thead><tr><th>Время</th><th>Этаж</th><th>Статус</th></tr></thead><tbody id="historyBody"></tbody></table></div></section><section id="tab-qr" class="hidden"><div class="admin-actions no-print"><input id="baseUrl" class="field" placeholder="Адрес сайта"><button id="saveBase" class="btn secondary">Сохранить адрес</button><button id="printQR" class="btn">🖨 Печать 7 табличек</button><button id="rotateQR" class="btn danger">♻ Обновить все 7 QR</button></div><div class="notice no-print">QR постоянные и меняются только вручную.</div><div id="qrGrid" class="qrgrid"></div></section></div></section><footer>BOP MASTER • Hohus Maksym</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
